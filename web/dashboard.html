<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PC Rotation Manager</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --text: #eef1f8;
      --muted: #8b93a7;
      --p1: #4caf50;
      --p2: #2196f3;
      --accent: #e67e22;
      --danger: #e74c3c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding: 16px;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    header h1 { font-size: 1.25rem; font-weight: 700; }
    header p { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
    .grid {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr 1fr;
    }
    @media (max-width: 480px) {
      .grid { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      border: 2px solid transparent;
      transition: border-color 0.2s;
    }
    .card.active { border-color: currentColor; }
    .card.p1 { color: var(--p1); }
    .card.p2 { color: var(--p2); }
    .card h2 { font-size: 0.9rem; opacity: 0.9; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .card h2 svg { flex-shrink: 0; }
    .time {
      font-family: Consolas, monospace;
      font-size: 2rem;
      font-weight: 700;
      color: var(--text);
    }
    .meta { font-size: 0.8rem; color: var(--muted); margin-top: 6px; }
    .status-bar {
      background: var(--card);
      border-radius: 12px;
      padding: 14px;
      margin: 16px 0;
      text-align: center;
    }
    .status-bar .active-player { font-size: 1.1rem; font-weight: 700; }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-top: 8px;
    }
    .badge.break { background: #f1c40f33; color: #f1c40f; }
    .badge.stopwatch { background: #e67e2233; color: var(--accent); }
    .badge.alarm { background: #e74c3c44; color: var(--danger); animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.6; } }
    .logs {
      background: var(--card);
      border-radius: 12px;
      padding: 14px;
      margin-top: 16px;
    }
    .logs h3 { font-size: 0.85rem; color: var(--muted); margin-bottom: 10px; }
    .logs ul { list-style: none; font-family: Consolas, monospace; font-size: 0.78rem; }
    .logs li { padding: 4px 0; border-bottom: 1px solid #ffffff10; color: #bbb; }
    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.75rem;
      margin-top: 20px;
    }
    .online { color: var(--p1); }
    .offline { color: var(--danger); }
  </style>
</head>
<body>

    <h1>PC Rotation Manager</h1>
    <p id="connection">Connecting…</p>
  </header>

  <div class="status-bar">
    <div class="active-player" id="active-label">Active: —</div>
    <div class="meta" id="finishes-at"></div>
    <div id="badges"></div>
  </div>

  <script>
    let lastStatus = null;
    let lastStatusReceivedAt = 0;

    function fmt(minutes) {
      const sec = Math.max(0, Math.ceil(minutes * 60));
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    function fmtTime(date) {
      let h = date.getHours();
      const m = String(date.getMinutes()).padStart(2, '0');
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return `${h}:${m} ${ampm}`;
    }

    function renderStatus(data) {
      lastStatus = data;
      lastStatusReceivedAt = Date.now();
      updateUI();
    }

    function updateUI() {
      if (!lastStatus) return;

      let p1_time = lastStatus.player1_time;
      let p2_time = lastStatus.player2_time;
      let stopwatch_minutes = lastStatus.stopwatch_minutes;

      if (!lastStatus.on_break && !lastStatus.alarm_active) {
        const elapsedSeconds = (Date.now() - lastStatusReceivedAt) / 1000;
        const elapsedMinutes = elapsedSeconds / 60;
        if (lastStatus.active_player === 1) {
          p1_time = Math.max(0, p1_time - elapsedMinutes);
          if (lastStatus.stopwatch_mode) {
            stopwatch_minutes += elapsedMinutes;
          }
        } else if (lastStatus.active_player === 2) {
          p2_time = Math.max(0, p2_time - elapsedMinutes);
        }
      }

      document.getElementById('p1-time').textContent = fmt(p1_time);
      document.getElementById('p2-time').textContent = fmt(p2_time);
document.getElementById('p1-break').textContent = `${lastStatus.break_tokens_p1}/2 tokens`;
document.getElementById('p2-break').textContent = `${lastStatus.break_tokens_p2}/2 tokens`;
      document.getElementById('active-label').textContent = `Active: Player ${lastStatus.active_player}`;

      // Calculate finishes-at time
      const activeTime = lastStatus.active_player === 1 ? p1_time : p2_time;
      if (activeTime > 0) {
        const finishDate = new Date(Date.now() + activeTime * 60 * 1000);
        document.getElementById('finishes-at').textContent = `Finishes at ${fmtTime(finishDate)}`;
      } else {
        document.getElementById('finishes-at').textContent = 'Time depleted';
      }

      document.getElementById('card-p1').classList.toggle('active', lastStatus.active_player === 1);
      document.getElementById('card-p2').classList.toggle('active', lastStatus.active_player === 2);

      const badges = [];
      if (lastStatus.on_break) badges.push(`<span class="badge break">On break: ${lastStatus.break_reason || '—'}</span>`);
      if (lastStatus.stopwatch_mode) badges.push(`<span class="badge stopwatch">Stopwatch ${fmt(stopwatch_minutes)}</span>`);
      if (lastStatus.alarm_active) badges.push('<span class="badge alarm">TIME UP</span>');
      document.getElementById('badges').innerHTML = badges.join(' ');

      document.getElementById('connection').textContent = 'Online';
      document.getElementById('connection').classList.remove('offline');
      document.getElementById('connection').classList.add('online');
    }

    async function fetchStatus() {
      try {
        const res = await fetch('/status', { cache: 'no-store' });
        if (!res.ok) throw new Error('bad status');
        renderStatus(await res.json());
      } catch (e) {
        document.getElementById('connection').textContent = lastStatus
          ? 'Offline'
          : 'Cannot reach PC server';
        document.getElementById('connection').classList.add('offline');
        document.getElementById('connection').classList.remove('online');
      }
    }

    fetchStatus();
    setInterval(fetchStatus, 3000);
    setInterval(updateUI, 100);
  </script>
</body>
</html>
